# https://packaging.python.org/en/latest/tutorials/packaging-projects/
# https://hatch.pypa.io/latest/config/build/

[project]
name = "tutor-livedeps"
description = "livedeps plugin for Tutor"
authors = [
  { name = "Muhammad Labeeb"},
  { email = "muhammad.labeeb@arbisoft.com" },
]
license = { text = "AGPL-3.0-only" }

readme = {file = "README.rst", content-type = "text/x-rst"}
requires-python = ">= 3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",

]
dependencies = [
    "tutor>=22.0.0,<23.0.0",
    # Provides the Django default S3 storage (RustFS/Azure/external S3) that
    # livedeps uses via storages["default"], replacing the archived tutor-minio.
    # Not published on PyPI yet, so it is referenced directly from Git.
    "tutor-objectstorage @ git+https://github.com/overhangio/tutor-objectstorage.git",
]
optional-dependencies = { dev = ["tutor[dev]>=22.0.0,<23.0.0", "ruff"] }

# These fields will be set by hatch_build.py
dynamic = ["version"]

[tool.hatch.version]
path = "tutorlivedeps/__about__.py"

# tutor-objectstorage is referenced as a direct Git URL in
# project.dependencies (it is not published on PyPI yet). Hatch rejects
# direct references during metadata generation unless this is enabled.
[tool.hatch.metadata]
allow-direct-references = true

# https://packaging.python.org/en/latest/specifications/well-known-project-urls/#well-known-labels
[project.urls]
Documentation = "https://github.com/overhangio/tutor-livedeps#readme"
Issues = "https://github.com/overhangio/tutor-livedeps/issues"
Source = "https://github.com/overhangio/tutor-livedeps"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tutorlivedeps"]

[tool.hatch.build.targets.sdist]
# Disable strict naming, otherwise twine is not able to detect name/version
strict-naming = false
include = [ "/tutorlivedeps"]
exclude = ["tests*"]

[project.entry-points."tutor.plugin.v1"]
livedeps = "tutorlivedeps.plugin"
